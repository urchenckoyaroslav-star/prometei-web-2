name: Refresh weekly FM nominations
on:
  schedule:
    - cron: '12 0 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/chart_catalog.py
      - run: |
          git config user.name "PROMETEI FM"
          git config user.email "actions@users.noreply.github.com"
          git add fm-ballot.json
          git diff --cached --quiet || (git commit -m "Refresh regional FM nominees" && git push)
