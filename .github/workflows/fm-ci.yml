name: PROMETEI FM checks
on:
  push:
    paths:
      - "fm*"
      - "functions/api/fm/**"
      - "scripts/build.mjs"
      - "scripts/check-fm-ux.mjs"
      - "portfolio.js"
      - "portfolio.html"
      - "tests/**"
      - "package.json"
      - "scripts/prometei_fm_dj.py"
      - ".github/workflows/fm-ci.yml"
  pull_request:
    paths:
      - "fm*"
      - "functions/api/fm/**"
      - "scripts/build.mjs"
      - "tests/fm.test.mjs"
      - "package.json"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify syntax and FM controls
        run: npm run check
      - name: Check Python Windows DJ code syntax
        run: python3 -m py_compile scripts/prometei_fm_dj.py scripts/fm_remote_control.py
      - name: Test Windows DJ shuffle, 36h retry, and safe file selection
        run: python3 -m unittest discover -s tests -p 'test_fm_dj.py' -v
      - name: Build static site and SEO documents
        run: npm run build
      - name: Audit seven-language radio, responsive assets and public links
        run: node scripts/check-fm-ux.mjs
      - name: Verify Cloudflare Pages output
        run: |
          test -f dist/fm.html
          test -f dist/fm-studio.html
          test -f dist/_routes.json
          test -f dist/sitemap.xml
          test ! -f dist/functions/api/fm/station.js
          grep -q 'https://prometei-web-2.pages.dev/fm' dist/sitemap.xml
          grep -q 'PROMETEI FM — Online Radio' dist/fm.html
          for lang in uk ru de es zh ja; do
            test -f "dist/$lang/fm.html"
            grep -q "https://prometei-web-2.pages.dev/$lang/fm" "dist/$lang/fm.html"
          done
          grep -q 'hreflang="ru"' dist/fm.html
          grep -q '/ja/fm' dist/sitemap.xml
          test -f dist/fm-i18n.js
          test -f dist/fm-translations.json
